{% extends "base.html" %}

{% block title %}새 대시보드{% endblock %}

{% block content %}
<div class="px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-xl">
    <!-- Breadcrumb -->
    <nav class="mb-6 flex items-center gap-2 text-sm text-slate-500">
      <a href="/dashboard" class="hover:text-slate-700 transition-colors">대시보드</a>
      <svg class="h-4 w-4 shrink-0 text-slate-300" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
      <span class="text-slate-900 font-medium">새 대시보드</span>
    </nav>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h1 class="text-xl font-bold text-slate-900 mb-6">대시보드 만들기</h1>

      <form method="POST" action="/dashboard/new" class="space-y-5">
        <div>
          <label class="label-text" for="name">대시보드 이름 <span class="text-red-500">*</span></label>
          <input
            id="name"
            name="name"
            type="text"
            required
            maxlength="100"
            class="input-field mt-1"
            placeholder="예: 주간 매출 현황"
            autofocus
          />
        </div>
        <div>
          <label class="label-text" for="description">설명 (선택)</label>
          <textarea
            id="description"
            name="description"
            rows="3"
            maxlength="500"
            class="input-field mt-1 resize-none"
            placeholder="이 대시보드에 대한 간략한 설명을 입력하세요."
          ></textarea>
        </div>
        <div class="flex items-center justify-end gap-3 pt-2">
          <a href="/dashboard" class="btn-secondary">취소</a>
          <button type="submit" class="btn-primary">대시보드 생성</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
