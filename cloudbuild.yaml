steps:
  # 1. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '.'

  # 2. Artifact Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA'

  # 3. Cloud Run 배포 (Secret Manager 연동)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--set-secrets=DATABRICKS_HOST=DATABRICKS_HOST:latest,DATABRICKS_TOKEN=DATABRICKS_TOKEN:latest,GENIE_SPACE_ID=GENIE_SPACE_ID:latest,SECRET_KEY=SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest'
      - '--add-cloudsql-instances=$_CLOUDSQL_INSTANCE'

  # 4. Slack 배포 완료 알림
  - name: 'gcr.io/cloud-builders/curl'
    id: 'notify-success'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        LOG_URL="https://console.cloud.google.com/cloud-build/builds;region=asia-northeast3/$BUILD_ID?project=$PROJECT_ID"
        REPO_URL="https://github.com/Money-Digger/genie-web-app/commit/$COMMIT_SHA"

        curl -s -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"#36a64f\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \":check-custom:  genie-web-app | deploy success\",
                    \"emoji\": true
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Branch*\n$BRANCH_NAME\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Commit*\n<$$REPO_URL|$SHORT_SHA>\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Service*\n$_SERVICE_NAME\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Repository*\n<https://github.com/Money-Digger/genie-web-app|Money-Digger/genie-web-app>\"}
                  ]
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View Build Logs  :cloudbuild:\", \"emoji\": true},
                      \"url\": \"$$LOG_URL\"
                    }
                  ]
                },
                {
                  \"type\": \"divider\"
                }
              ]
            }]
          }" \
          "$$CLOUD_BUILD_SLACK_WEBHOOK_URL"
    secretEnv:
      - 'CLOUD_BUILD_SLACK_WEBHOOK_URL'

images:
  - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/CLOUD_BUILD_SLACK_WEBHOOK_URL/versions/latest
      env: 'CLOUD_BUILD_SLACK_WEBHOOK_URL'

substitutions:
  _AR_HOSTNAME: asia-northeast3-docker.pkg.dev
  _AR_REPO: cloud-run-source-deploy
  _SERVICE_NAME: genie-web-app
  _DEPLOY_REGION: asia-northeast3
  _CLOUDSQL_INSTANCE: equity-derivative-etl:asia-northeast3:genie-web-app  # 실제 값으로

options:
  logging: CLOUD_LOGGING_ONLY
